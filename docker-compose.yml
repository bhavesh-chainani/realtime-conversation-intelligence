services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      SQLITE_DB_PATH: /data/sessions.db
      STORAGE_BACKEND: ${STORAGE_BACKEND:-sqlite}
      ASYNC_JOBS_ENABLED: ${ASYNC_JOBS_ENABLED:-false}
      JOB_STORE_BACKEND: ${JOB_STORE_BACKEND:-sqlite}
      INFERENCE_QUEUE_MODE: ${INFERENCE_QUEUE_MODE:-poll}
      AWS_SQS_INFERENCE_QUEUE_URL: ${AWS_SQS_INFERENCE_QUEUE_URL:-}
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_ASYNC_JOBS: ${NEXT_PUBLIC_USE_ASYNC_JOBS:-false}
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${NEXT_PUBLIC_COGNITO_DOMAIN:-}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID:-}
      NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${NEXT_PUBLIC_COGNITO_REDIRECT_URI:-http://localhost:3000}
      NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${NEXT_PUBLIC_COGNITO_LOGOUT_URI:-http://localhost:3000}
      NEXT_PUBLIC_COGNITO_RESPONSE_TYPE: ${NEXT_PUBLIC_COGNITO_RESPONSE_TYPE:-token}
      NEXT_PUBLIC_COGNITO_SCOPE: ${NEXT_PUBLIC_COGNITO_SCOPE:-openid email profile}
      NEXT_PUBLIC_USE_ASYNC_JOBS: ${NEXT_PUBLIC_USE_ASYNC_JOBS:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      SQLITE_DB_PATH: /data/sessions.db
      STORAGE_BACKEND: ${STORAGE_BACKEND:-sqlite}
      JOB_STORE_BACKEND: ${JOB_STORE_BACKEND:-sqlite}
      INFERENCE_QUEUE_MODE: ${INFERENCE_QUEUE_MODE:-poll}
      AWS_REGION: ${AWS_REGION:-}
      AWS_SQS_INFERENCE_QUEUE_URL: ${AWS_SQS_INFERENCE_QUEUE_URL:-}
    volumes:
      - backend_data:/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
