# Automatic stops for the GPU server, so a forgotten instance does not keep billing.
# Read by scripts/install_gpu_services.sh and by the idle check that runs every 5 minutes.
# A stop keeps the disk and setup: Start the instance again from the AWS console.
# See when it will stop next:  ssh ... ubuntu@<ip> rci-autostop-status

# Idle stop: power off after this many minutes with no app use, meaning no connection to the
# backend (page loads, live calls) and no interactive login. An open SSH tunnel alone does not
# count. Applies within 5 minutes of editing. 0 turns the idle stop off.
IDLE_MINUTES=45

# Nightly stop at this local time (24-hour HH:MM) in NIGHTLY_TZ. Empty turns it off.
# After changing either value, re-run: sudo scripts/install_gpu_services.sh
NIGHTLY_STOP=02:00
NIGHTLY_TZ=Asia/Singapore

# Used from the laptop by scripts/gpu.sh (ignored on the server).
INSTANCE_NAME=rci-gpu
AWS_REGION=ap-southeast-2
SSH_USER=ubuntu
SSH_KEY=$HOME/.ssh/rci-gpu.pem
REMOTE_DIR=rci
